[project]
name = "normly-core"
version = "0.1.1"
description = "normly free core: reference graph data model and repository layer"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<0.4",
    "sentence-transformers>=3.0,<4.0",
    "docling>=2.123,<3.0",
    "pyarrow>=17,<20",
    "cryptography>=43,<46",
    # torch/torchvision are only needed transitively (sentence-transformers,
    # docling), but are listed here so the uv workspace's index source for
    # them applies: [tool.uv.sources] only binds direct requirements. Upstream
    # version constraints still apply on top of these floors.
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.15,<5.0",
    "reportlab>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Docling's own internal pipeline code (standard_pdf_pipeline.py) reads its
    # own deprecated PipelineOptions.generate_table_images field on every
    # convert() call; nothing in normly_core touches this field. Remove this
    # filter once docling stops triggering the warning internally, or if
    # docling is dropped.
    "ignore:This field is deprecated\\. Use `generate_page_images=True` and call `TableItem\\.get_image\\(\\)` to extract table images from page images\\.:DeprecationWarning:docling.*",
]
