<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1420" width="1080" height="1420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1080" height="1420" fill="#fbfbfa"/>

  <text x="48" y="52" font-size="25" font-weight="600" fill="#1c1c1a">normly — Entwicklungsphasen</text>
  <text x="48" y="78" font-size="14" fill="#6b7280">Freier Kern zuerst · kommerzielle Schicht darauf · Volltexte gegen Beteiligung als Fernziel</text>
  <line x1="48" y1="96" x2="1032" y2="96" stroke="#e2e0dc" stroke-width="1"/>

  <!-- spine -->
  <line x1="86" y1="150" x2="86" y2="1250" stroke="#d6d2cb" stroke-width="2"/>

  <!-- PHASE 0 -->
  <circle cx="86" cy="168" r="9" fill="#0f766e"/>
  <text x="118" y="160" font-size="12" font-weight="600" fill="#9a9793">PHASE 0 · JETZT — bis Dezember</text>
  <text x="118" y="184" font-size="19" font-weight="600" fill="#1c1c1a">Lauffähiger, kommunizierbarer Prototyp</text>

  <rect x="118" y="200" width="430" height="176" rx="8" fill="#f0f7f6" stroke="#4f9a92" stroke-width="1.5"/>
  <text x="138" y="226" font-size="13.5" font-weight="600" fill="#0f5f58">Freier Kern (AGPL-3.0)</text>
  <text x="138" y="250" font-size="12.5" fill="#2f6b65">· Eigenständige Webanwendung, kein Widget</text>
  <text x="138" y="270" font-size="12.5" fill="#2f6b65">· Open-Source-LLM, kein eigenes normlyLLM</text>
  <text x="138" y="290" font-size="12.5" fill="#2f6b65">· PostgreSQL + pgvector, Repository-Schicht</text>
  <text x="138" y="310" font-size="12.5" fill="#2f6b65">· Container + Compose, Daten außerhalb des Image</text>
  <text x="138" y="330" font-size="12.5" fill="#2f6b65">· STACKIT Git + Pipelines · PWA, keine native App</text>
  <text x="138" y="350" font-size="12.5" fill="#2f6b65">· DCO, SBOM, Lizenz-Scan, signierte Artefakte</text>
  <text x="528" y="226" font-size="11" fill="#5d8b86" text-anchor="end">REQ-OSS · REQ-GIT</text>

  <rect x="566" y="200" width="430" height="176" rx="8" fill="#fff" stroke="#c9c5be" stroke-width="1.5"/>
  <text x="586" y="226" font-size="13.5" font-weight="600" fill="#1c1c1a">Datenbestand — nur Kategorien A und B</text>
  <text x="586" y="250" font-size="12.5" fill="#5c5952">· EUR-Lex: harmonisierte Normen, datiert</text>
  <text x="586" y="270" font-size="12.5" fill="#5c5952">· Verweise aus Gesetzen und Verordnungen</text>
  <text x="586" y="290" font-size="12.5" fill="#5c5952">· DGUV- und BAuA-Regelwerke</text>
  <text x="586" y="310" font-size="12.5" fill="#5c5952">· Arbeitsprogramme CEN / CENELEC, ISO / IEC</text>
  <text x="586" y="334" font-size="12.5" font-weight="600" fill="#8a2f2f">· kein Scraping kommerzieller Kataloge</text>
  <text x="586" y="356" font-size="12.5" font-weight="600" fill="#0f5f58">· Referenzgraph entsteht bereits hier</text>
  <text x="976" y="226" font-size="11" fill="#9a9793" text-anchor="end">REQ-PIPE-009</text>

  <line x1="86" y1="400" x2="86" y2="424" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- PHASE 1 -->
  <circle cx="86" cy="452" r="9" fill="#0f766e"/>
  <text x="118" y="444" font-size="12" font-weight="600" fill="#9a9793">PHASE 1 · MVP</text>
  <text x="118" y="468" font-size="19" font-weight="600" fill="#1c1c1a">Öffentlicher freier Kern + erste Partnerschaft</text>

  <rect x="118" y="484" width="430" height="156" rx="8" fill="#f0f7f6" stroke="#4f9a92" stroke-width="1.5"/>
  <text x="138" y="510" font-size="13.5" font-weight="600" fill="#0f5f58">Freier Kern — öffentlich</text>
  <text x="138" y="534" font-size="12.5" fill="#2f6b65">· Chat mit Quellenangabe, Graph-First-Auflösung</text>
  <text x="138" y="554" font-size="12.5" fill="#2f6b65">· Öffentliche API (Apache-2.0 spezifiziert)</text>
  <text x="138" y="574" font-size="12.5" fill="#2f6b65">· Freier Dump: ODbL, RDF / JSON-LD</text>
  <text x="138" y="594" font-size="12.5" fill="#2f6b65">· PWA offline-fähig (freie Inhalte)</text>
  <text x="138" y="614" font-size="12.5" fill="#2f6b65">· Weiterleitung zum Shop des Herausgebers</text>
  <text x="528" y="510" font-size="11" fill="#5d8b86" text-anchor="end">REQ-GRAPH-001/003</text>

  <rect x="566" y="484" width="430" height="156" rx="8" fill="#f2f6fb" stroke="#7ea3cc" stroke-width="1.5"/>
  <text x="586" y="510" font-size="13.5" font-weight="600" fill="#1e4e79">Partnerportal — Metadaten zuerst</text>
  <text x="586" y="534" font-size="12.5" fill="#31597f">· Zulieferung, Statusverfolgung, Rückzug</text>
  <text x="586" y="554" font-size="12.5" fill="#31597f">· Rechte-Metadaten als Pflichtfeld</text>
  <text x="586" y="574" font-size="12.5" fill="#31597f">· Attributionserfassung ab Tag eins</text>
  <text x="586" y="598" font-size="12.5" font-weight="600" fill="#1e4e79">Erster Gesprächspartner: Austrian Standards</text>
  <text x="586" y="620" font-size="12" fill="#5a7fa5">Ask = Katalogmetadaten, nicht Volltext</text>
  <text x="976" y="510" font-size="11" fill="#5a7fa5" text-anchor="end">REQ-PART-001/002</text>

  <line x1="86" y1="664" x2="86" y2="688" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- PHASE 2 -->
  <circle cx="86" cy="716" r="9" fill="#1e4e79"/>
  <text x="118" y="708" font-size="12" font-weight="600" fill="#9a9793">PHASE 2 · MONETARISIERUNG</text>
  <text x="118" y="732" font-size="19" font-weight="600" fill="#1c1c1a">Kommerzielle Schicht — Ausgründung GmbH</text>

  <rect x="118" y="748" width="430" height="176" rx="8" fill="#f2f6fb" stroke="#7ea3cc" stroke-width="1.5"/>
  <text x="138" y="774" font-size="13.5" font-weight="600" fill="#1e4e79">Kostenpflichtige Dienste</text>
  <text x="138" y="798" font-size="12.5" fill="#31597f">· Managed Hosting mit SLA, Mandantenfähigkeit</text>
  <text x="138" y="818" font-size="12.5" fill="#31597f">· Compliance-Instanz mit Audit-Trail</text>
  <text x="138" y="838" font-size="12.5" fill="#31597f">· Abo-Modell, Zahlungsanbindung (Stripe)</text>
  <text x="138" y="858" font-size="12.5" fill="#31597f">· API-Schlüssel, Kontingente, Abrechnung</text>
  <text x="138" y="878" font-size="12.5" fill="#31597f">· Auswertungsberichte für Herausgeber</text>
  <text x="138" y="898" font-size="12.5" fill="#31597f">· Native App: geschützte Offline-Volltexte</text>
  <text x="528" y="774" font-size="11" fill="#5a7fa5" text-anchor="end">REQ-COM-001…004</text>

  <rect x="566" y="748" width="430" height="176" rx="8" fill="#f0f7f6" stroke="#4f9a92" stroke-width="1.5"/>
  <text x="586" y="774" font-size="13.5" font-weight="600" fill="#0f5f58">Umsatzbeteiligung der Herausgeber</text>
  <text x="586" y="798" font-size="12.5" fill="#2f6b65">· Pro-rata je Quelle · Schlüssel je Herausgeber</text>
  <text x="586" y="818" font-size="12.5" fill="#2f6b65">· Prüffähiger Abrechnungsbericht, exportierbar</text>
  <text x="586" y="838" font-size="12.5" fill="#2f6b65">· Externe Prüfung kann nachrechnen</text>
  <text x="586" y="862" font-size="12.5" font-weight="600" fill="#0f5f58">Der Hebel für das Volltextgespräch</text>
  <text x="586" y="884" font-size="12" fill="#3f6b66">Reale Zahlen statt Modellrechnung</text>
  <text x="586" y="906" font-size="12.5" font-weight="600" fill="#8a2f2f">Ausgeschlossen: personalisierte Werbung</text>
  <text x="976" y="774" font-size="11" fill="#5d8b86" text-anchor="end">REQ-PART-003</text>

  <line x1="86" y1="948" x2="86" y2="972" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- PHASE 3 -->
  <circle cx="86" cy="1000" r="9" fill="#1e4e79"/>
  <text x="118" y="992" font-size="12" font-weight="600" fill="#9a9793">PHASE 3 · SKALIERUNG</text>
  <text x="118" y="1016" font-size="19" font-weight="600" fill="#1c1c1a">Integration in Drittsoftware — der zentrale USP</text>

  <rect x="118" y="1032" width="430" height="136" rx="8" fill="#f2f6fb" stroke="#7ea3cc" stroke-width="2"/>
  <text x="138" y="1058" font-size="13.5" font-weight="600" fill="#1e4e79">Drittsystem-Integration</text>
  <text x="138" y="1082" font-size="12.5" fill="#31597f">· CAD, ERP, Expertensysteme über die offene API</text>
  <text x="138" y="1102" font-size="12.5" fill="#31597f">· Stabile Erweiterungsschnittstelle, kein Fork nötig</text>
  <text x="138" y="1122" font-size="12.5" fill="#31597f">· Größter erwarteter Umsatzträger</text>
  <text x="138" y="1146" font-size="12" fill="#5a7fa5">Eigenes normlyLLM optional, nicht Voraussetzung</text>
  <text x="528" y="1058" font-size="11" fill="#5a7fa5" text-anchor="end">REQ-COM-001/002</text>

  <rect x="566" y="1032" width="430" height="136" rx="8" fill="#fff" stroke="#c9c5be" stroke-width="1.5"/>
  <text x="586" y="1058" font-size="13.5" font-weight="600" fill="#1c1c1a">Internationalisierung</text>
  <text x="586" y="1082" font-size="12.5" fill="#5c5952">· Weltweiter Bestand, mehrsprachig</text>
  <text x="586" y="1102" font-size="12.5" fill="#5c5952">· Lizenzklassifikation je Rechtsraum</text>
  <text x="586" y="1122" font-size="12.5" fill="#5c5952">· Vektorindex getrennt skaliert</text>
  <text x="586" y="1146" font-size="12" fill="#7a766e">Schema von Beginn an darauf ausgelegt</text>
  <text x="976" y="1058" font-size="11" fill="#9a9793" text-anchor="end">REQ-GRAPH-005/006</text>

  <line x1="86" y1="1192" x2="86" y2="1216" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Fernziel -->
  <circle cx="86" cy="1244" r="9" fill="#fbfbfa" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="118" y="1206" width="878" height="76" rx="8" fill="#f0f7f6" stroke="#4f9a92" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="138" y="1232" font-size="15.5" font-weight="600" fill="#0f5f58">Fernziel · Volltexte im Bestand — auf Vertragsbasis, gegen Umsatzbeteiligung</text>
  <text x="138" y="1256" font-size="12.5" fill="#2f6b65">normly ist dann nicht Wettbewerber, der Verkaufserlöse verdrängt, sondern Kanal, der neue Erlöse erschließt</text>
  <text x="138" y="1274" font-size="12.5" fill="#2f6b65">und nachvollziehbar zurückführt. Abschnittsebene im Graph wird damit erreichbar.</text>

  <!-- feedback -->
  <path d="M1010 1244 L1040 1244 L1040 562 L1002 562" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#art)"/>
  <text x="1052" y="900" font-size="11.5" fill="#0f766e" text-anchor="middle" transform="rotate(90 1052 900)">jede Stufe stärkt die Verhandlungsposition der nächsten</text>

  <line x1="48" y1="1330" x2="1032" y2="1330" stroke="#e2e0dc" stroke-width="1"/>
  <rect x="48" y="1346" width="14" height="14" rx="3" fill="#f0f7f6" stroke="#4f9a92" stroke-width="1.5"/>
  <text x="70" y="1358" font-size="12" fill="#5c5952">freier Kern (AGPL / ODbL)</text>
  <rect x="250" y="1346" width="14" height="14" rx="3" fill="#f2f6fb" stroke="#7ea3cc" stroke-width="1.5"/>
  <text x="272" y="1358" font-size="12" fill="#5c5952">kommerzielle Schicht (GmbH)</text>
  <rect x="474" y="1346" width="14" height="14" rx="3" fill="#fff" stroke="#c9c5be" stroke-width="1.5"/>
  <text x="496" y="1358" font-size="12" fill="#5c5952">Daten und Grundlagen</text>
  <text x="674" y="1358" font-size="12" fill="#8a2f2f">rot = dauerhaft ausgeschlossen</text>
</svg>
