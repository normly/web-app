[project]
site_name = "normly"
site_description = "Normen- und Regelwerkswissen, strukturiert als Graph."
site_author = "normly contributors"
docs_dir = "docs"

nav = [
  { "Start" = "index.md" },
  { "Guide" = [
    "guide/getting-started.md",
    "guide/self-hosting.md",
  ] },
  { "Concepts" = [
    "concepts/normen-graph.md",
    "concepts/lizenzmodell.md",
  ] },
  { "Architekturentscheidungen" = "adr/README.md" },
  { "Anforderungen (SRS)" = "srs/README.md" },
  { "Code-Referenz" = [
    "reference/core.md",
    "reference/api.md",
    "reference/accounts.md",
    "reference/chat.md",
  ] },
  { "Glossar" = "glossary.md" },
]

[project.theme]
font = false

[project.plugins.mkdocstrings.handlers.python]
paths = ["core/src", "api/src", "accounts/src", "chat/src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_submodules = true
show_source = true
docstring_style = "google"
