services:
  db:
    image: pgvector/pgvector:pg16
    container_name: normly-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: normly
      POSTGRES_PASSWORD: normly
      POSTGRES_DB: normly
    volumes:
      - normly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normly -d normly"]
      interval: 3s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: normly-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NORMLY_DATABASE_URL: postgresql+psycopg://normly:normly@db:5432/normly
    command: ["alembic", "upgrade", "head"]

  accounts:
    build:
      context: .
      dockerfile: accounts/Dockerfile
    container_name: normly-accounts
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    environment:
      NORMLY_DATABASE_URL: postgresql+psycopg://normly:normly@db:5432/normly
      NORMLY_GOOGLE_REDIRECT_URI: http://localhost:3000/api/auth/google/callback

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: normly-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    environment:
      NORMLY_DATABASE_URL: postgresql+psycopg://normly:normly@db:5432/normly

  chat:
    build:
      context: .
      dockerfile: chat/Dockerfile
    container_name: normly-chat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      accounts:
        condition: service_started
      api:
        condition: service_started
    ports:
      - "8003:8003"
    environment:
      NORMLY_DATABASE_URL: postgresql+psycopg://normly:normly@db:5432/normly
      NORMLY_API_BASE_URL: http://api:8002
      NORMLY_ACCOUNTS_BASE_URL: http://accounts:8001
      NORMLY_OLLAMA_BASE_URL: http://ollama:11434
      NORMLY_OLLAMA_MODEL: llama3.1:8b-instruct-q4_0

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: normly-frontend
    restart: unless-stopped
    depends_on:
      accounts:
        condition: service_started
      api:
        condition: service_started
      chat:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NORMLY_API_BASE_URL: http://api:8002
      NORMLY_ACCOUNTS_BASE_URL: http://accounts:8001
      NORMLY_CHAT_BASE_URL: http://chat:8003
      NORMLY_INSTANCE_NAME: "normly local"

  ollama:
    image: ollama/ollama:latest
    container_name: normly-ollama
    profiles:
      - chat-llm
    restart: unless-stopped
    dns:
      - 192.168.0.1
    ports:
      - "11435:11434"
    volumes:
      - normly-ollama:/root/.ollama

volumes:
  normly-pgdata:
  normly-ollama:
