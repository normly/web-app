name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-accounts:
    runs-on: stackit-docker
    container: python:3.12
    timeout-minutes: 30
    steps:
      - run: |
          (git --version >/dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq git)
          git init -q .
          git remote add origin "https://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: cd accounts && pip install -e ../core -e .[dev] && pytest

  test-api:
    runs-on: stackit-docker
    container: python:3.12
    timeout-minutes: 30
    steps:
      - run: |
          (git --version >/dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq git)
          git init -q .
          git remote add origin "https://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: cd api && pip install -e ../core -e .[dev] && pytest

  test-chat:
    runs-on: stackit-docker
    container: python:3.12
    timeout-minutes: 30
    steps:
      - run: |
          (git --version >/dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq git)
          git init -q .
          git remote add origin "https://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      # Exclude tests/test_structural_end_to_end.py: those 4 tests spawn sibling packages
      # via local-dev-only .venv/bin/uvicorn (see chat/tests/conftest.py:98-121), which
      # doesn't exist in CI (no per-package venvs built in fresh container). Tests excluded
      # from CI, not broken. See docs/superpowers/specs/2026-09-02-ci-pipeline-design.md.
      - run: cd chat && pip install -e ../core -e .[dev] && pytest --ignore=tests/test_structural_end_to_end.py

  test-core:
    runs-on: stackit-docker
    container: python:3.12
    timeout-minutes: 30
    steps:
      - run: |
          (git --version >/dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq git)
          git init -q .
          git remote add origin "https://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: apt-get update && apt-get install -y --no-install-recommends libgl1 && rm -rf /var/lib/apt/lists/*
      - run: cd core && pip install -e .[dev] && pytest

  test-frontend:
    runs-on: stackit-docker
    container: node:20
    timeout-minutes: 30
    steps:
      - run: |
          (git --version >/dev/null 2>&1) || (apt-get update -qq && apt-get install -y -qq git)
          git init -q .
          git remote add origin "https://${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - run: cd frontend && npm ci && npm test
