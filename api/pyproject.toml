[project]
name = "normly-api"
version = "0.1.0"
description = "normly free core: read-only HTTP API over the reference graph"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # Same-repo sibling package. The uv workspace (root pyproject.toml,
    # [tool.uv.sources]) resolves it from ../core, never from an index: it
    # is not published to one, so any PyPI name match would be a typosquat.
    # The version constraint is a defensive floor matching core/pyproject.toml.
    "normly-core>=0.1.0,<0.2.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "testcontainers[postgres]>=4.15,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
