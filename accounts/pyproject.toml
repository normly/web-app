[project]
name = "normly-accounts"
version = "0.1.0"
description = "normly free core: account registration, login, and session service"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # Same-repo sibling package -- install from ../core, never from a public
    # index (not published to one; a name match there would be a typosquat).
    # See api/pyproject.toml for the identical note.
    "normly-core>=0.1.0,<0.2.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<1.0",
    "bcrypt>=4.0,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.15,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_accounts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
