[project]
name = "normly-accounts"
version = "0.2.0"
description = "normly free core: account registration, login, and session service"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    # Same-repo sibling package, resolved by the uv workspace from ../core,
    # never from an index (see api/pyproject.toml for the full note).
    "normly-core>=0.1.0,<0.2.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<1.0",
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "Pillow>=10.0,<12.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "testcontainers[postgres]>=4.15,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_accounts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
